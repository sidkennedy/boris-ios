name: Boris
options:
  bundleIdPrefix: com.sidney
  deploymentTarget:
    iOS: "17.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
targets:
  Boris:
    type: application
    platform: iOS
    sources: [Boris]
    settings:
      base:
        # Use the checked-in plist; XcodeGen's `info` block replaces its contents.
        INFOPLIST_FILE: Boris/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sidney.boris
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: LiveKit
